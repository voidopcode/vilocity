# Every push to main builds both engines and publishes them as a new pre-release.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build
        # rustup installs the toolchain pinned in rust-toolchain.toml
        run: cargo build --release -p vilocity-native -p vilocity-compat

      - name: Package
        shell: pwsh
        run: |
          $v = "v0.1.${{ github.run_number }}"
          New-Item -ItemType Directory pkg/native, pkg/compat | Out-Null
          Copy-Item target/release/vilocity-native.exe pkg/native
          Copy-Item native/LICENSE pkg/native/LICENSE.txt
          Copy-Item target/release/vilocity-compat.exe pkg/compat
          Copy-Item compat/LICENSE pkg/compat/LICENSE.txt
          Copy-Item compat/THIRD_PARTY.md pkg/compat
          Compress-Archive pkg/native/* "pkg/vilocity-native-$v-windows-x64.zip"
          Compress-Archive pkg/compat/* "pkg/vilocity-compat-$v-windows-x64.zip"
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:VERSION pkg/*.zip --target $env:GITHUB_SHA `
            --title "Vilocity $env:VERSION" --notes-file .github/release-notes.md `
            --prerelease
