[package]
name = "vilocity-gpu"
description = "D3D12.X command streams and GPU memory, translated onto host D3D12."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
zlib-rs.workspace = true
tracing.workspace = true
anyhow.workspace = true
vilocity-formats.workspace = true
vilocity-pipeline.workspace = true
vilocity-shader = { workspace = true, features = ["host"] }

[build-dependencies]
blake3.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Debugging switches (frame capture, the host debug layer, per-draw data).
diagnostics = []

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# (Vilocity: DLSS through Streamline is louketa/foxhound's, lucas-3080 56dba41, GPL-3.0-or-later, as this.)
# Win32_Security_WinTrust and Win32_Security_Cryptography: the structures of
# the signature check of `sl.interposer.dll` (`streamline::verify_signature`).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
