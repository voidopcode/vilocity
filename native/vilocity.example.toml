# Copy to `vilocity.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VILOCITY_CONFIG selects a different config file.

[paths]
# Your own dump of Grand Theft Auto VI.     env: VILOCITY_GAME_DIR
game_dir = 'D:\vilocity-data\game'

# Derived data. Default: %LOCALAPPDATA%\vilocity\cache.   env: VILOCITY_CACHE_DIR
# cache_dir = 'D:\vilocity-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\vilocity\data.   env: VILOCITY_DATA_DIR
# data_dir = 'D:\vilocity-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: VILOCITY_TEST_TITLES (separated by ';')
test_titles = []
